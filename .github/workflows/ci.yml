name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    # Feature and hotfix branches get feedback too, before they are merged.
    branches: [main, develop, "feat/**", "hotfix/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so turbo and biome can compute what changed against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The e2e gate drives a real browser, which a fresh runner does not have. Docker for testcontainers is preinstalled.
      - run: pnpm --filter @espacios/web exec playwright install --with-deps chromium
      - run: pnpm check:ai --lines=60
      - name: Keep the Playwright report when a gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
